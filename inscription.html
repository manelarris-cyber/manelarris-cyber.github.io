<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Créez votre compte ImmoPremier gratuitement">
  <title>Inscription | ImmoPremier</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo" style="gap: 4px;">
    <img src="logo.png" alt="Logo ImmoPremier" class="custom-logo">
    <span>ImmoPremier</span>
</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="../index.html">Accueil</a></li>
      <li><a href="produits.html">Propriétés</a></li>
      <li><a href="connexion.html">Connexion</a></li>
      <li><a href="inscription.html" class="active nav-cta">S'inscrire</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="auth-page" style="padding:40px 20px;">
    <div class="auth-card" style="max-width:520px;">
      <div class="auth-logo">
                 <img src="logo.png" alt="Logo ImmoPremier" style="
    width:140px; 
    height:140px; 
    object-fit:contain; 
    filter: drop-shadow(0 0 20px rgba(139,92,246,1)) drop-shadow(0 0 40px rgba(236,72,153,0.7));
    margin-bottom:4px;
  ">
        <h2>Créer un compte</h2>
        <p>Rejoignez ImmoPremier gratuitement dès aujourd'hui</p>
      </div>

      <div class="alert" id="register-alert" role="alert"></div>

      <form id="register-form" onsubmit="handleRegister(event)" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-prenom">Prénom *</label>
            <input
              type="text"
              id="reg-prenom"
              name="prenom"
              placeholder="Votre prénom"
              autocomplete="given-name"
              data-validate="prenom"
              required
            >
            <div class="error-msg"></div>
          </div>
          <div class="form-group">
            <label for="reg-nom">Nom *</label>
            <input
              type="text"
              id="reg-nom"
              name="nom"
              placeholder="Votre nom"
              autocomplete="family-name"
              data-validate="nom"
              required
            >
            <div class="error-msg"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Adresse email *</label>
          <input
            type="email"
            id="reg-email"
            name="email"
            placeholder="votre@email.com"
            autocomplete="email"
            data-validate="email"
            required
          >
          <div class="error-msg"></div>
        </div>

        <div class="form-group">
          <label for="reg-tel">Numéro de téléphone</label>
          <input
            type="tel"
            id="reg-tel"
            name="tel"
            placeholder="0661 234 567"
            autocomplete="tel"
            data-validate="phone"
          >
          <div class="error-msg"></div>
        </div>

        <div class="form-group">
          <label for="reg-password">Mot de passe *</label>
          <div style="position:relative;">
            <input
              type="password"
              id="reg-password"
              name="password"
              placeholder="Minimum 8 caractères"
              autocomplete="new-password"
              data-validate="password"
              required
              oninput="checkPasswordStrength(this.value)"
            >
            <button type="button" onclick="togglePwd('reg-password', this)"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;">
              
            </button>
          </div>
          <div class="error-msg"></div>
          <div id="pwd-strength" style="margin-top:8px; display:none;">
            <div style="height:4px; border-radius:4px; background:var(--border); overflow:hidden;">
              <div id="pwd-bar" style="height:100%; width:0%; transition:all 0.3s; border-radius:4px;"></div>
            </div>
            <p id="pwd-label" style="font-size:0.75rem; margin-top:4px; color:var(--muted);"></p>
          </div>
          <p style="font-size:0.75rem; color:var(--muted); margin-top:6px;">
            Min. 8 caractères, 1 majuscule, 1 chiffre, 1 caractère spécial (@$!%*?&)
          </p>
        </div>

        <div class="form-group">
          <label for="reg-confirm">Confirmer le mot de passe *</label>
          <div style="position:relative;">
            <input
              type="password"
              id="reg-confirm"
              name="confirm"
              placeholder="Répétez votre mot de passe"
              autocomplete="new-password"
              required
            >
            <button type="button" onclick="togglePwd('reg-confirm', this)"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;">
            </button>
          </div>
          <div class="error-msg"></div>
        </div>

        <div style="display:flex; align-items:flex-start; gap:8px; margin-bottom:16px;">
          <input type="checkbox" id="accept-terms" style="accent-color:var(--primary); width:15px; height:15px; margin-top:2px;" required>
          <label for="accept-terms" style="font-size:0.83rem; color:var(--muted); cursor:pointer; line-height:1.4;">
            J'accepte les <a href="#" style="color:var(--primary);">conditions d'utilisation</a> et la <a href="#" style="color:var(--primary);">politique de confidentialité</a>
          </label>
        </div>

        <button type="submit" class="btn-full" id="register-btn">Créer mon compte gratuitement</button>

      </form>

      <p class="auth-footer-text" style="margin-top:20px;">
        Vous avez déjà un compte ?
        <a href="connexion.html">Se connecter</a>
      </p>
    </div>
  </main>

  <script src="../javascript/produits.js"></script>
  <script src="../javascript/auth.js"></script>
  <script>
    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; }
      else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    function checkPasswordStrength(val) {
      const bar = document.getElementById('pwd-bar');
      const label = document.getElementById('pwd-label');
      const container = document.getElementById('pwd-strength');
      if (!val) { container.style.display = 'none'; return; }
      container.style.display = 'block';

      let score = 0;
      if (val.length >= 8)   score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[@$!%*?&\-_#]/.test(val)) score++;
      if (val.length >= 12)  score++;

      const levels = [
        { pct: '20%', color: '#e53935', text: 'Très faible' },
        { pct: '40%', color: '#FF5722', text: 'Faible' },
        { pct: '60%', color: '#FFC107', text: 'Moyen' },
        { pct: '80%', color: '#4CAF50', text: 'Fort' },
        { pct: '100%', color: '#2E7D32', text: 'Très fort ✅' }
      ];
      const level = levels[Math.min(score - 1, 4)] || levels[0];
      bar.style.width = level.pct;
      bar.style.background = level.color;
      label.style.color = level.color;
      label.textContent = level.text;
    }
  </script>
</body>
</html>
